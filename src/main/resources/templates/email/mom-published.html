<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minutes of Meeting</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="{{LOGO_URL}}" alt="{{ORG_NAME}}" height="44" style="height:44px;display:block;border:0;" />
            </td>
          </tr>

          <tr>
            <td style="background:#ffffff;border-radius:16px;padding:40px;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

              <div style="display:inline-block;padding:5px 14px;background-color:#f5f3ff;border:1px solid #ddd6fe;border-radius:20px;margin-bottom:20px;">
                <span style="font-size:12px;font-weight:600;color:#6d28d9;text-transform:uppercase;letter-spacing:0.05em;">Minutes of Meeting</span>
              </div>

              <h1 style="margin:0 0 6px;font-size:22px;font-weight:700;color:#111827;letter-spacing:-0.3px;">
                {{TITLE}}
              </h1>
              <p style="margin:0 0 24px;font-size:14px;color:#6b7280;">
                {{AUTHOR_NAME}} recorded new meeting minutes in {{ORG_NAME}}
              </p>

              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td align="center">
                    <a href="{{FEED_URL}}" style="display:inline-block;padding:12px 28px;background-color:#111827;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">
                      View Minutes
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0;font-size:13px;color:#6b7280;text-align:center;line-height:1.6;">
                Visible to staff only.
              </p>

            </td>
          </tr>

          <tr>
            <td style="padding:20px 0 0;text-align:center;font-size:12px;color:#9ca3af;line-height:1.6;">
              &copy; {{ORG_NAME}}. All rights reserved.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
