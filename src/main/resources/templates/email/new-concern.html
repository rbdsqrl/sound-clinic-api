<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Concern Raised</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="{{LOGO_URL}}" alt="{{ORG_NAME}}" height="44" style="height:44px;display:block;border:0;" />
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff;border-radius:16px;padding:40px;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

              <!-- Alert badge -->
              <div style="display:inline-block;padding:5px 14px;background-color:#fee2e2;border:1px solid #fecaca;border-radius:20px;margin-bottom:20px;">
                <span style="font-size:12px;font-weight:600;color:#991b1b;text-transform:uppercase;letter-spacing:0.05em;">Concern Raised</span>
              </div>

              <!-- Heading -->
              <h1 style="margin:0 0 6px;font-size:22px;font-weight:700;color:#111827;letter-spacing:-0.3px;">
                {{PATIENT_NAME}} &mdash; {{PROGRAM_NAME}}
              </h1>
              <p style="margin:0 0 28px;font-size:14px;color:#6b7280;">
                A parent has raised a concern about this program's progress.
              </p>

              <!-- Description -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:28px;">
                <tr style="background:#f9fafb;">
                  <td style="padding:14px 16px;font-size:14px;color:#111827;line-height:1.6;">{{DESCRIPTION}}</td>
                </tr>
              </table>

              <!-- CTA -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center">
                    <a href="{{DASHBOARD_URL}}"
                       style="display:inline-block;padding:13px 36px;background-color:#6366f1;color:#ffffff;text-decoration:none;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:0.01em;">
                      View in Dashboard
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 0 0;text-align:center;font-size:12px;color:#9ca3af;line-height:1.6;">
              This notification was sent to the assigned therapist and admins of {{ORG_NAME}}.<br/>
              &copy; {{ORG_NAME}}. All rights reserved.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
